<div class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <div class="header-text">
        <h2>Registrar Usuario</h2>
        <p>Agrega un usuario con acceso al sistema</p>
      </div>
      <button class="btn-close-top" (click)="close()">&times;</button>
    </div>

    <div class="modal-body">
      <div *ngIf="mensaje" class="status-msg" [class.error]="tipoMensaje === 'error'" [class.ok]="tipoMensaje === 'ok'">
        {{ mensaje }}
      </div>

      <div class="form-grid">
        <div class="form-group full-width">
          <label>Nombre Completo</label>
          <input type="text" [(ngModel)]="form.nombreCompleto" placeholder="Ej. Juan Perez" />
        </div>

        <div class="form-group">
          <label>Número Documento (DNI)</label>
          <input type="text" [(ngModel)]="form.dni" (input)="permitirSoloNumeros($event, 'dni')" placeholder="75483367" maxlength="15" />
        </div>
        <div class="form-group">
          <label>Rol</label>
          <select [(ngModel)]="form.rolId">
            <option [ngValue]="0">Seleccione Rol</option>
            <option *ngFor="let rol of roles" [ngValue]="rol.id">{{ rol.nombre }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>Ubicación</label>
          <select [(ngModel)]="form.ubicacionId">
            <option [ngValue]="0">Seleccione Ubicación</option>
            <option *ngFor="let ubicacion of ubicaciones" [ngValue]="ubicacion.id">{{ ubicacion.nombre }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Teléfono (Opcional)</label>
          <input type="text" [(ngModel)]="form.telefono" (input)="permitirSoloNumeros($event, 'telefono')" placeholder="999888777" maxlength="10" />
        </div>

        <div class="form-group">
          <label>Estado</label>
          <select [(ngModel)]="form.estadoLaboral">
            <option [ngValue]="true">Activo</option>
            <option [ngValue]="false">Inactivo</option>
          </select>
        </div>
        <div class="form-group">
          <label>Nombre de Usuario</label>
          <input type="text" [(ngModel)]="form.usuario" placeholder="Ej. juanperez123" autocomplete="username" />
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="form.password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label>Confirmar Contraseña</label>
          <input [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="form.confirmarPassword" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <div class="form-group full-width checkbox-container">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="mostrarPassword" />
            Mostrar contraseñas
          </label>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancelar" (click)="close()">Cancelar</button>
      <button type="button" class="btn-guardar" [disabled]="guardando" (click)="save()">
        {{ guardando ? 'Guardando...' : 'Registrar Usuario' }}
      </button>
    </div>
  </div>
</div>
