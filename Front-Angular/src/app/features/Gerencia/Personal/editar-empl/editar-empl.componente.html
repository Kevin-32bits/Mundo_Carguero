<div class="modal-overlay">
  <div class="modal-container">
    
    <div class="modal-header">
      <div>
        <h2>Editar Usuario</h2>
        <p>Modifica los datos del personal seleccionado</p>
      </div>
      <button class="btn-close-top" (click)="cerrarModal()">&times;</button>
    </div>

    <div class="modal-body">
        <form #editForm="ngForm" class="form-grid" autoComplete="off">
        
            <div class="form-group full-width">
            <label>Nombre Completo</label>
            <input type="text" name="nombre" [(ngModel)]="empleadoEdit.nombreCompleto" required placeholder="Ej. Juan Perez">
            </div>

            <div class="form-group">
            <label>DNI</label>
            <input type="text" name="dni" [(ngModel)]="empleadoEdit.dni" required placeholder="8 dígitos" maxlength="8">
            </div>

            <div class="form-group">
            <label>Teléfono</label>
            <input type="text" name="telefono" [(ngModel)]="empleadoEdit.telefono" placeholder="Ej. 999888777">
            </div>

            <div class="form-group">
            <label>Usuario (Login)</label>
            <input type="text" name="usuario" [(ngModel)]="empleadoEdit.usuario" required>
            </div>

            <div class="form-group">
            <label>Contraseña <span class="opcional-text">(Dejar en blanco para no cambiar)</span></label>
            <input type="password" name="password" [(ngModel)]="empleadoEdit.password" placeholder="Nueva contraseña">
            </div>

            <div class="form-group">
            <label>Rol</label>
            <select name="rolId" [(ngModel)]="empleadoEdit.rolId" required>
                <option value="" disabled selected>Seleccione un rol...</option>
                @for (rol of roles; track rol.id) {
                <option [value]="rol.id">{{ rol.nombre }}</option>
                }
            </select>
            </div>

            <div class="form-group">
            <label>Ubicación (Sede)</label>
            <select name="ubicacionId" [(ngModel)]="empleadoEdit.ubicacionId" required>
                <option value="" disabled selected>Seleccione una sede...</option>
                @for (ubi of ubicaciones; track ubi.id) {
                <option [value]="ubi.id">{{ ubi.nombre }}</option>
                }
            </select>
            </div>
        </form>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancelar" (click)="cerrarModal()">Cancelar</button>
      <button type="button" class="btn-guardar" (click)="guardarCambios()" [disabled]="!editForm.valid || cargando">
        {{ cargando ? 'Guardando...' : 'Guardar Cambios' }}
      </button>
    </div>

  </div>
</div>
