<div class="container-fluid vh-100 d-flex align-items-center justify-content-center main-wrapper">
  <div class="card border-0 shadow-lg card-container">
    <div class="row g-0 h-100">

      <div class="col-md-6 d-none d-md-block left-side-bg"></div>
      <div class="col-12 col-md-6 right-side-bg p-5 d-flex flex-column justify-content-center">
        <div class="mx-auto w-100" style="max-width: 320px;">
          <h2 class="text-white fw-bold mb-1">Bienvenido</h2>
          <p class="text-white-50 small mb-4">Iniciar Sesión</p>

          <form (ngSubmit)="ingresarAlSistema(usuarioInput.value, passwordInput.value)">
            <div class="input-group mb-3 custom-input">
              <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              <input #usuarioInput type="text" class="form-control shadow-none" placeholder="Usuario"
                     (input)="verificarCampos(usuarioInput.value, passwordInput.value)">
            </div>
            
            <div class="input-group mb-2 custom-input">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input #passwordInput [type]="Contra_Visible ? 'text' : 'password'" class="form-control shadow-none" placeholder="Contraseña"
                     (input)="verificarCampos(usuarioInput.value, passwordInput.value)">
              <span class="input-group-text" role="button" (click)="OJOPassword()">
                <i class="bi" [class]="Contra_Visible ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
              </span>
            </div>

            <div class="error-inline mt-4" *ngIf="mensajeError">
              <i class="bi bi-exclamation-circle-fill"></i> {{ mensajeError }}
            </div>

            <button type="submit"
                    class="btn btn-ingresar w-100 py-2 fw-bold text-white mb-3 mt-3"
                    [disabled]="bloqueado">
              <span *ngIf="!bloqueado">INGRESAR</span>
              <span *ngIf="bloqueado">
                <i class="bi bi-clock-fill me-1"></i> Espera {{ tiempoFormateado }}
              </span>
            </button>

            <div class="mt-auto pt-3 text-center">
              <p class="copyright-text">
                © 2026 Sistema de Gestión Empresarial. Todos los derechos reservados.
              </p>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="mostrarErrorLogin">
  <div class="modal-error" (click)="$event.stopPropagation()">
    <div class="modal-error-icon">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <p class="modal-error-title">Acceso Bloqueado</p>
    <p class="modal-error-message">
      Has fallado <strong>{{ intentosFallidos }} intentos</strong> consecutivos.<br>
      Por seguridad, debes esperar antes de intentarlo de nuevo.
    </p>
    <div class="modal-countdown">{{ tiempoFormateado }}</div>
  </div>
</div>
